name: SBOM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SBOM
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          python -m pip install -e .
          cyclonedx-py environment --output-format json --output-file visionq-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: visionq-sbom
          path: visionq-sbom.json
