name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify
        run: |
          python -m compileall visionq tests
          ruff check .
          ruff format --check .
          mypy visionq
          python -m pytest
      - name: Build
        run: |
          python -m build
          twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
