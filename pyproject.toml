[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionq"
version = "0.1.0"
description = "Reference Python library for spatio-temporal attention backend routing in vision and video transformers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "VisionQ contributors" }]
dependencies = ["torch>=2.1", "numpy>=1.23"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "nox>=2024.4",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
triton = ["triton>=2.3; platform_system == 'Linux'"]

[project.urls]
Homepage = "https://github.com/leifson1337/visionq"
Repository = "https://github.com/leifson1337/visionq"
Issues = "https://github.com/leifson1337/visionq/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["visionq*"]

[tool.setuptools.package-data]
visionq = ["py.typed"]


[tool.pytest.ini_options]
addopts = "--cov=visionq --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "gpu: tests requiring CUDA hardware",
  "slow: slower integration or benchmark-adjacent tests",
  "triton: tests requiring Triton",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["visionq"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
