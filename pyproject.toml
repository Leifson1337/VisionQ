[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionq"
version = "0.1.0"
authors = [
  { name="Jules", email="jules@example.com" },
]
description = "VisionQ: Spatio-Temporal Attention Runtime for Vision and Video Transformers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/example/visionq"

[tool.setuptools.packages.find]
where = ["."]
include = ["visionq*"]
